<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SHDWYI — Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root{
    --bg: #08080b;
    --wall: #121017;
    --crimson: #a8203f;
    --crimson-glow: #ff3b5c;
    --amber: #e8b874;
    --ink: #ece7e0;
    --ink-dim: #756f6a;
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;600&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Space Grotesk', sans-serif; }
  canvas{ display:block; }

  #hud{
    position:fixed; inset:0; pointer-events:none; z-index:10;
  }

  /* --- Top navigation bar --- */
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 40px;
    background:linear-gradient(to bottom, rgba(4,5,10,0.75), rgba(4,5,10,0));
  }
  #title{
    font-family:'Cormorant Garamond', serif;
    font-size:19px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink); font-weight:600;
  }
  #title span{ color:var(--crimson-glow); }
  #nav{ display:flex; align-items:center; gap:34px; }
  #nav span{
    font-size:12px; letter-spacing:0.18em; color:#b9b3ac; text-transform:uppercase;
    pointer-events:auto; cursor:pointer; transition:color 0.25s ease;
  }
  #nav span:hover{ color:var(--crimson-glow); }
  #nav .nav-cta{
    border:1px solid rgba(200,190,180,0.4); border-radius:24px;
    padding:11px 26px; color:var(--ink);
  }
  #nav .nav-cta:hover{ border-color:var(--crimson-glow); color:var(--crimson-glow); }

  /* --- Corner glass panels --- */
  #controls-panel, #info-panel{
    position:absolute; bottom:34px;
    background:rgba(10,11,17,0.55); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    padding:20px 22px; min-width:210px;
  }
  #controls-panel{ left:34px; }
  #info-panel{ right:34px; max-width:260px; }
  .panel-label{
    font-size:10px; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--crimson-glow); margin-bottom:16px;
  }
  .ctl-row{ display:flex; align-items:center; gap:7px; margin-bottom:11px; }
  .ctl-row:last-child{ margin-bottom:0; }
  .ctl-txt{ font-size:12px; letter-spacing:0.06em; color:#c4beb7; margin-left:6px; text-transform:uppercase; }
  .key{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:26px; height:26px; padding:0 7px;
    border:1px solid rgba(255,255,255,0.22); border-radius:5px;
    font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--ink);
    background:rgba(255,255,255,0.03);
  }
  .key.wide{ min-width:44px; }
  .key.sm{ min-width:20px; height:20px; font-size:11px; vertical-align:middle; }
  .info-text{ font-size:13px; line-height:1.6; color:#c4beb7; margin-bottom:16px; }
  .dots{ display:flex; gap:9px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.22); }
  .dot.on{ background:var(--crimson-glow); box-shadow:0 0 8px var(--crimson-glow); }

  #prompt{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(10px);
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:20px; color:var(--ink); opacity:0; letter-spacing:0.02em;
    transition:opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none; z-index:10; text-align:center;
  }
  #prompt.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #prompt .key{
    display:inline-block; border:1px solid var(--crimson-glow); color:var(--crimson-glow);
    border-radius:4px; padding:2px 9px; margin-right:8px; font-family:'Space Grotesk',sans-serif;
    font-style:normal; font-size:13px; vertical-align:2px;
  }

  #fade{
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:20;
    transition:opacity 1.1s ease;
  }
  #fade.on{ opacity:1; }

  #panel{
    position:fixed; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #14111a 0%, #08080b 75%);
  }
  #panel.show{ display:flex; }
  .panel-inner{
    max-width:640px; width:88%; opacity:0; transform:translateY(16px);
    transition:opacity 0.8s ease 0.15s, transform 0.8s ease 0.15s;
  }
  #panel.reveal .panel-inner{ opacity:1; transform:translateY(0); }

  .eyebrow{
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--crimson-glow);
    margin-bottom:14px;
  }
  .p-title{
    font-family:'Cormorant Garamond', serif; font-size:44px; color:var(--ink);
    line-height:1.05; margin-bottom:18px; font-weight:600;
  }
  .p-desc{
    font-size:14.5px; line-height:1.75; color:#c9c3bc; margin-bottom:26px; font-weight:400;
  }
  .p-tags{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:34px; }
  .p-tags span{
    font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    border:1px solid #3a3540; color:var(--ink-dim); padding:5px 11px; border-radius:2px;
  }
  #back-btn{
    pointer-events:auto; cursor:pointer;
    background:none; border:1px solid var(--crimson); color:var(--ink);
    font-family:'Space Grotesk', sans-serif; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; padding:13px 26px; transition:all 0.25s ease;
  }
  #back-btn:hover{ background:var(--crimson); box-shadow:0 0 24px rgba(168,32,63,0.5); }

  #loading{
    position:fixed; inset:0; background:#08080b; z-index:50;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--ink-dim);
    letter-spacing:0.08em; font-size:15px; transition:opacity 0.8s ease;
  }
</style>
</head>
<body>

<div id="loading">entering the gallery…</div>
<div id="fade"></div>

<div id="hud">
  <div id="topbar">
    <div id="title">S H D W<span>Y I</span> &nbsp;—&nbsp; G A L L E R Y</div>
    <div id="nav">
      <span>ABOUT</span><span>SKILLS</span><span>EXPERIENCE</span>
      <span class="nav-cta">CONTACT</span>
    </div>
  </div>

  <div id="controls-panel">
    <div class="panel-label">Controls</div>
    <div class="ctl-row"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="ctl-txt">Move</span></div>
    <div class="ctl-row"><span class="key wide">Shift</span><span class="ctl-txt">Run</span></div>
    <div class="ctl-row"><span class="key">🖱</span><span class="ctl-txt">Look around</span></div>
    <div class="ctl-row"><span class="key">E</span><span class="ctl-txt">Interact</span></div>
  </div>

  <div id="info-panel">
    <div class="panel-label">Info</div>
    <div class="info-text">Walk up to a project and press <span class="key sm">E</span> to view more details.</div>
    <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</div>

<div id="prompt"><span class="key">E</span>step into the work</div>

<div id="panel">
  <div class="panel-inner">
    <div class="eyebrow" id="p-eyebrow">Project 01</div>
    <div class="p-title" id="p-title">Title</div>
    <div class="p-desc" id="p-desc">Description</div>
    <div class="p-tags" id="p-tags"></div>
    <button id="back-btn">← Back to the gallery</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   SHDWYI — Walkable Gallery Portfolio Demo
   Vanilla Three.js, single file.
   ========================================================= */

// ---------- Project data (placeholder — swap in real projects) ----------
const PROJECTS = [
  {
    id: 0, eyebrow: 'Project 01',
    title: 'SHDWYI Recruiting Engine',
    desc: 'A talent-sourcing operation built to map the game industry city by city — starting with Montreal, Toronto, and Vancouver. Verified research, structured data, and outreach infrastructure built to scale.',
    tags: ['Recruiting', 'Data Ops', 'Excel / Automation'],
    color: 0x7a1f2e, accent: 0xe8b874
  },
  {
    id: 1, eyebrow: 'Project 02',
    title: 'MIRAGE — Ren Ashveil',
    desc: 'An original character concept blending a street-magician silhouette with a Killua / Gojo-inspired presence. Full character bible, ability set, and an interactive glitch-styled mood board.',
    tags: ['Character Design', 'Worldbuilding', 'AI Art'],
    color: 0x2a2440, accent: 0xff3b5c
  },
  {
    id: 2, eyebrow: 'Project 03',
    title: 'JobAssistAI',
    desc: 'A React-based job application assistant — profile storage, tailored cover letter generation, and a Kanban-style tracker for the entire application pipeline.',
    tags: ['React', 'Productivity', 'Job Search'],
    color: 0x1c2a33, accent: 0x6fb8c9
  },
  {
    id: 3, eyebrow: 'Project 04',
    title: 'Fragments (Fiction)',
    desc: 'A short fiction piece following a teenage protagonist through a surreal, philosophical fall — written in raw, minimal prose rather than ornate description.',
    tags: ['Fiction', 'Prose', 'Existential'],
    color: 0x201c1f, accent: 0xa8203f
  }
];

// ---------- Core setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070c);
scene.fog = new THREE.Fog(0x06070c, 16, 52);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Room dimensions ----------
const ROOM_W = 20, ROOM_D = 28, ROOM_H = 6;

// ---------- Dark marble floor ----------
function makeMarbleTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0c0d12'; ctx.fillRect(0,0,1024,1024);

  // soft tonal patches
  for(let i=0;i<26;i++){
    const x = Math.random()*1024, y = Math.random()*1024, r = 90+Math.random()*220;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(${34+Math.random()*20|0},${36+Math.random()*20|0},${46+Math.random()*22|0},0.35)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  // marble veins — jagged random walks
  for(let i=0;i<30;i++){
    ctx.strokeStyle = `rgba(190,200,215,${0.04+Math.random()*0.09})`;
    ctx.lineWidth = 0.8 + Math.random()*1.8;
    let x = Math.random()*1024, y = Math.random()*1024;
    ctx.beginPath(); ctx.moveTo(x,y);
    const steps = 14+Math.random()*20|0;
    let dir = Math.random()*Math.PI*2;
    for(let s=0;s<steps;s++){
      dir += (Math.random()-0.5)*1.4;
      const len = 14+Math.random()*36;
      x += Math.cos(dir)*len; y += Math.sin(dir)*len;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3,3);
  return tex;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 90),
  new THREE.MeshStandardMaterial({ map: makeMarbleTexture(), color:0xbfc4cf, roughness:0.28, metalness:0.35 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const HALL_H = 15;

// ============================================================
//  VOLUMETRIC GOD-RAY down the central aisle
// ============================================================
const godRayMat = new THREE.MeshBasicMaterial({ color:0xd7e4f5, transparent:true, opacity:0.05, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
const godRay = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 4.5, HALL_H, 24, 1, true), godRayMat);
godRay.position.set(0, HALL_H/2, -2);
godRay.renderOrder = 3;
scene.add(godRay);
const godRayCore = new THREE.SpotLight(0xdfeaf8, 2.6, 40, Math.PI/9, 0.6, 1.0);
godRayCore.position.set(0, HALL_H+2, -1);
godRayCore.target.position.set(0, 0, -3);
scene.add(godRayCore); scene.add(godRayCore.target);

// ---------- Ambient / cinematic base light ----------
scene.add(new THREE.AmbientLight(0x2a3348, 0.45));
const moon = new THREE.DirectionalLight(0x556688, 0.3);
moon.position.set(-6, 12, 4);
scene.add(moon);
const fillWarm = new THREE.PointLight(0x6b4a3a, 0.5, 30);
fillWarm.position.set(0, 6, 10);
scene.add(fillWarm);

// ---------- Paintings (fanned V-layout facing the viewer) ----------
const paintingGroups = [];
const SPAWN = new THREE.Vector3(0, 0, ROOM_D/2 - 3);

// near frames wide on the edges, far frames pulled toward center — like a receding gallery fan
const LAYOUT = [
  { x: -9.0, z:  3.0 },   // near left
  { x:  9.0, z:  3.0 },   // near right
  { x: -4.6, z: -4.5 },   // far left
  { x:  4.6, z: -4.5 }    // far right
];

PROJECTS.forEach((proj, i)=>{
  const { x, z } = LAYOUT[i];
  const group = createPainting(proj);
  group.position.set(x, 2.7, z);
  // face the spawn/entrance so every frame reads head-on from the aisle
  group.rotation.y = Math.atan2(SPAWN.x - x, SPAWN.z - z);
  group.userData.project = proj;
  group.userData.worldPos = new THREE.Vector3(x, 2.7, z);
  scene.add(group);
  paintingGroups.push(group);
});

function createPainting(proj){
  const group = new THREE.Group();

  const goldFrameMat = new THREE.MeshStandardMaterial({ color:0xba9648, roughness:0.35, metalness:0.9, emissive:0x1c1405, emissiveIntensity:0.5 });

  // Outer ornate frame (built from bars so the art shows through the middle)
  const FW = 2.9, FH = 3.8, bar = 0.28, depth = 0.18;
  const barT = new THREE.Mesh(new THREE.BoxGeometry(FW, bar, depth), goldFrameMat);
  barT.position.y = FH/2 - bar/2;
  const barB = barT.clone(); barB.position.y = -(FH/2 - bar/2);
  const barL = new THREE.Mesh(new THREE.BoxGeometry(bar, FH, depth), goldFrameMat);
  barL.position.x = -(FW/2 - bar/2);
  const barR = barL.clone(); barR.position.x = FW/2 - bar/2;
  [barT,barB,barL,barR].forEach(b=>{ b.castShadow=true; group.add(b); });

  // Corner ornaments
  const ornGeo = new THREE.SphereGeometry(0.16, 10, 10);
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sy])=>{
    const o = new THREE.Mesh(ornGeo, goldFrameMat);
    o.position.set(sx*(FW/2-bar/2), sy*(FH/2-bar/2), depth*0.4);
    o.scale.z = 0.6;
    group.add(o);
  });

  // Canvas (placeholder art via CanvasTexture)
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 520;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,520);
  grad.addColorStop(0, '#' + proj.color.toString(16).padStart(6,'0'));
  grad.addColorStop(1, '#08080b');
  ctx.fillStyle = grad; ctx.fillRect(0,0,400,520);
  // stylized "artwork" — glowing arch motif in the accent color
  const acc = '#' + proj.accent.toString(16).padStart(6,'0');
  ctx.strokeStyle = acc; ctx.lineWidth = 3; ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.arc(200,230,110,Math.PI,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(90,230); ctx.lineTo(90,360); ctx.moveTo(310,230); ctx.lineTo(310,360); ctx.stroke();
  ctx.globalAlpha = 0.18; ctx.fillStyle = acc;
  ctx.beginPath(); ctx.arc(200,250,70,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e8e3dd';
  ctx.font = 'italic 20px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(proj.eyebrow, 200, 455);
  ctx.font = '600 27px Georgia';
  wrapText(ctx, proj.title, 200, 488, 340, 29);

  const canvasTex = new THREE.CanvasTexture(canvas);
  const art = new THREE.Mesh(
    new THREE.PlaneGeometry(FW-bar*1.6, FH-bar*1.6),
    new THREE.MeshStandardMaterial({ map: canvasTex, roughness:0.5, emissive:0xffffff, emissiveMap:canvasTex, emissiveIntensity:0.25 })
  );
  art.position.z = 0.02;
  group.add(art);

  // Spotlight from above, like a gallery pin-light
  const spot = new THREE.SpotLight(0xf0d9a8, 2.0, 11, Math.PI/6, 0.5, 1.2);
  spot.position.set(0, 3.4, 2.2);
  spot.target = group;
  spot.castShadow = false;
  group.add(spot);
  group.add(spot.target);

  return group;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '', lines = [];
  for(const w of words){
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w + ' '; }
    else line = test;
  }
  lines.push(line);
  const startY = y - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, startY + i*lineHeight));
}

// ---------- Character (shadow-figure silhouette) ----------
const character = new THREE.Group();
const darkMat = new THREE.MeshStandardMaterial({ color:0x0a0a0c, roughness:0.7, metalness:0.1 });

const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.95, 14), darkMat);
torso.position.y = 1.05; torso.castShadow = true;
character.add(torso);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), darkMat);
head.position.y = 1.72; head.castShadow = true;
character.add(head);

const hipL = new THREE.Object3D(); hipL.position.set(-0.14, 0.84, 0); character.add(hipL);
const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.09,0.85,10), darkMat);
legL.position.set(0, -0.425, 0); legL.castShadow = true; hipL.add(legL);

const hipR = new THREE.Object3D(); hipR.position.set(0.14, 0.84, 0); character.add(hipR);
const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.09,0.85,10), darkMat);
legR.position.set(0, -0.425, 0); legR.castShadow = true; hipR.add(legR);

const shoulderL = new THREE.Object3D(); shoulderL.position.set(-0.34, 1.45, 0); character.add(shoulderL);
const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.065,0.72,10), darkMat);
armL.position.set(0, -0.36, 0); armL.castShadow = true; shoulderL.add(armL);

const shoulderR = new THREE.Object3D(); shoulderR.position.set(0.34, 1.45, 0); character.add(shoulderR);
const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.065,0.72,10), darkMat);
armR.position.set(0, -0.36, 0); armR.castShadow = true; shoulderR.add(armR);

// Crimson core glow — chest ember + point light (signature element)
const emberMat = new THREE.MeshBasicMaterial({ color:0xff3b5c });
const ember = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), emberMat);
ember.position.set(0, 1.1, 0.27);
character.add(ember);
const emberLight = new THREE.PointLight(0xff3b5c, 1.1, 3.2);
emberLight.position.copy(ember.position);
character.add(emberLight);

// Faint "gaze" light from the character's eyes
const gazeLight = new THREE.SpotLight(0xdcdcea, 0.5, 14, Math.PI/6, 0.6, 1.5);
gazeLight.position.set(0, 1.72, 0.2);
const gazeTarget = new THREE.Object3D();
gazeTarget.position.set(0, 1.72, 5);
character.add(gazeLight, gazeTarget);
gazeLight.target = gazeTarget;

character.position.set(0, 0, ROOM_D/2 - 3);
scene.add(character);

// ---------- Controls ----------
const keys = {};
addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key.toLowerCase()==='e') tryEnterPainting();
});
addEventListener('keyup', e=> keys[e.key.toLowerCase()] = false);

let camYaw = Math.PI, camPitch = 0.25, camDist = 5.2, camHeight = 2.0;
let dragging = false, lastX=0, lastY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointermove', e=>{
  if(!dragging) return;
  camYaw   -= (e.clientX-lastX) * 0.006;
  camPitch  = Math.max(-1.45, Math.min(1.45, camPitch + (e.clientY-lastY)*0.004));
  lastX = e.clientX; lastY = e.clientY;
});

let facing = Math.PI; // character yaw
let nearestPainting = null;
let state = 'explore'; // explore | transition-in | viewing | transition-out

const clock = new THREE.Clock();

function updateMovement(dt){
  const forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
  const right = new THREE.Vector3(forward.z, 0, -forward.x);
  const move = new THREE.Vector3();
  if(keys['w']) move.sub(forward);
  if(keys['s']) move.add(forward);
  if(keys['a']) move.sub(right);
  if(keys['d']) move.add(right);

  const moving = move.lengthSq() > 0;
  if(moving){
    const speed = keys['shift'] ? 5.8 : 3.2;
    move.normalize().multiplyScalar(speed*dt);
    character.position.add(move);
    const targetFacing = Math.atan2(move.x, move.z);
    let diff = targetFacing - facing;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    facing += diff * Math.min(1, dt*10);

    const walkT = performance.now()*(keys['shift'] ? 0.013 : 0.008);
    hipL.rotation.x = Math.sin(walkT)*0.6;
    hipR.rotation.x = Math.sin(walkT+Math.PI)*0.6;
    shoulderL.rotation.x = Math.sin(walkT+Math.PI)*0.5;
    shoulderR.rotation.x = Math.sin(walkT)*0.5;
  } else {
    hipL.rotation.x *= 0.8; hipR.rotation.x *= 0.8;
    shoulderL.rotation.x *= 0.8; shoulderR.rotation.x *= 0.8;
  }
  character.rotation.y = facing;

  // open world — no boundary clamp

  ember.position.y = 1.1 + Math.sin(performance.now()*0.004)*0.02;
}

function updateCamera(dt){
  const target = character.position.clone().add(new THREE.Vector3(0,camHeight,0));
  const offset = new THREE.Vector3(
    Math.sin(camYaw)*Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw)*Math.cos(camPitch)
  ).multiplyScalar(camDist);
  const desired = target.clone().add(offset);
  camera.position.lerp(desired, Math.min(1, dt*6));
  camera.lookAt(target);
}

function checkProximity(){
  let closest = null, closestDist = 3.2;
  paintingGroups.forEach(g=>{
    const d = character.position.distanceTo(g.userData.worldPos);
    if(d < closestDist){ closest = g; closestDist = d; }
  });
  nearestPainting = closest;
  document.getElementById('prompt').classList.toggle('show', !!closest && state==='explore');
}

// ---------- Transition into a painting ----------
function tryEnterPainting(){
  if(state !== 'explore' || !nearestPainting) return;
  state = 'transition-in';
  document.getElementById('prompt').classList.remove('show');

  const proj = nearestPainting.userData.project;
  const fade = document.getElementById('fade');
  const startPos = camera.position.clone();
  const startQuat = camera.quaternion.clone();
  const endPos = nearestPainting.userData.worldPos.clone().add(
    new THREE.Vector3(0,0,0).setFromMatrixPosition(nearestPainting.matrixWorld).sub(nearestPainting.userData.worldPos)
  );
  // simpler: fly to a point close in front of the painting, looking at it
  const dirToPainting = nearestPainting.userData.worldPos.clone().sub(character.position).normalize();
  const flyTarget = nearestPainting.userData.worldPos.clone().sub(dirToPainting.clone().multiplyScalar(1.1));

  let t = 0;
  const dur = 1.3;
  function step(){
    t += clock.getDelta();
    const k = Math.min(1, t/dur);
    const ease = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(startPos, flyTarget, ease);
    const m = new THREE.Matrix4().lookAt(camera.position, nearestPainting.userData.worldPos, new THREE.Vector3(0,1,0));
    const q = new THREE.Quaternion().setFromRotationMatrix(m);
    camera.quaternion.slerpQuaternions(startQuat, q, ease);

    if(k > 0.55) fade.classList.add('on');

    if(k < 1) requestAnimationFrame(step);
    else openPanel(proj);
  }
  step();
}

function openPanel(proj){
  document.getElementById('p-eyebrow').textContent = proj.eyebrow;
  document.getElementById('p-title').textContent = proj.title;
  document.getElementById('p-desc').textContent = proj.desc;
  const tagsEl = document.getElementById('p-tags');
  tagsEl.innerHTML = '';
  proj.tags.forEach(t=>{
    const s = document.createElement('span'); s.textContent = t; tagsEl.appendChild(s);
  });

  const panel = document.getElementById('panel');
  panel.classList.add('show');
  requestAnimationFrame(()=> requestAnimationFrame(()=> panel.classList.add('reveal')));
  state = 'viewing';
}

document.getElementById('back-btn').addEventListener('click', ()=>{
  const panel = document.getElementById('panel');
  panel.classList.remove('reveal');
  setTimeout(()=>{
    panel.classList.remove('show');
    document.getElementById('fade').classList.remove('on');
    state = 'explore';
    clock.getDelta();
  }, 500);
});

// ---------- Resize ----------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Main loop ----------
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if(state === 'explore'){
    updateMovement(dt);
    updateCamera(dt);
    checkProximity();
  }
  renderer.render(scene, camera);
}

// kick off
setTimeout(()=>{
  const loading = document.getElementById('loading');
  loading.style.opacity = 0;
  setTimeout(()=> loading.style.display='none', 850);
}, 500);
clock.getDelta();
animate();
</script>
